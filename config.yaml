# ==============================================================================
# LDSC & Epigenetic Pipeline Configuration (VIBRA HPC Defaults)
# ==============================================================================

# Slurm Cluster Defaults
slurm_partition: "irbio01"

# Shell Environment & Conda Setup on Cluster
use_conda_activation: true
conda_sh: "/aplic/anaconda/2024.02/etc/profile.d/conda.sh"
ldsc_env: "ldsc"
snakemake_env: "snakemake_env"
python_bin: "python"

# LDSC Software & Script Paths (relative to project root)
ldsc_script: "../ldsc/ldsc.py"
munge_script: "../ldsc/munge_sumstats.py"

# Reference Panels & LD Scores (relative to project root)
snplist: "data/reference/w_hm3.snplist"
ld_ref: "data/reference/LDscores"

# Epigenetic Panels
meth_types:
  - "DNA_ASM"
  - "RNA_m6A"

# GWAS Traits & Summary Statistics Mapping
traits:
  - "BipolarDisorder2024"
  - "SUD2023"
  - "SuicideAttempt"

gwas_sumstats:
  BipolarDisorder2024: "data/raw_data/BipolarDisorder2024_gwas.txt"
  SUD2023: "data/raw_data/SUD2023_gwas.txt"
  SuicideAttempt: "data/raw_data/SuicideAttempt_gwas.txt"

# DNA ASM Mapping & CpG-to-TSS Distance Parameters
methylation:
  dna_mapping_table: "data/methylation/DNA_ASM_mapping_table.tsv"
  cpg_coordinates: "data/annotations/cpg_coordinates_hg19.tsv"
  gene_tss: "data/annotations/gencode_v19_gene_tss.tsv"
  tss_distance_cutoff: 5000

# GTEx v10 Brain eQTL Lookup Parameters (13 Brain Regions)
gtex:
  brain_tissues:
    - "Brain_Amygdala"
    - "Brain_Anterior_cingulate_cortex_BA24"
    - "Brain_Caudate_basal_ganglia"
    - "Brain_Cerebellar_Hemisphere"
    - "Brain_Cerebellum"
    - "Brain_Cortex"
    - "Brain_Frontal_Cortex_BA9"
    - "Brain_Hippocampus"
    - "Brain_Hypothalamus"
    - "Brain_Nucleus_accumbens_basal_ganglia"
    - "Brain_Putamen_basal_ganglia"
    - "Brain_Spinal_cord_cervical_c-1"
    - "Brain_Substantia_nigra"
  p_threshold: 0.05
  gwas_p_threshold: 0.001
  cache_file: "results/methylation/.gtex_eqtl_cache.json"

# Cross-Trait DNA ASM Recurrence Defaults
cross_trait:
  fdr_method: "storey"
  min_recurrence: 2
  fdr_threshold: 0.05





