# ==============================================================================
# DNA & RNA Methylation x GWAS Pipeline Configuration (VIBRA HPC Defaults)
# All paths are relative to the repository root.
# ==============================================================================

# GWAS Traits & Summary Statistics
# Every GWAS file in raw_data_dir (e.g. *_gwas.txt, *_gwas.txt.gz, *.tsv) is discovered
# automatically. Leave `traits` empty to analyze all of them, or restrict a run with a list
# here or on the command line:  snakemake --config traits=TraitA,TraitB ...
raw_data_dir: "data/raw_data"
traits: []
# Optional extra traits stored outside raw_data_dir (trait name -> relative file path)
gwas_sumstats: {}

# GWAS Sumstats Munging (LDSC munge_sumstats.py, sibling ../ldsc repository)
# Output: results/munged/{trait}.sumstats.gz. Sample size per trait: manual N (n_override)
# > N column (n_col_override) > auto-detected column (N, N_eff, Neff, N_EFF, N_TOTAL, Weight).
ldsc:
  munge_script: "../ldsc/munge_sumstats.py"
  # Genetic correlation (target `rg`): ldsc.py --rg with 1000G HapMap3 LD scores (chromosomes 1-22)
  ldsc_script: "../ldsc/ldsc.py"
  ld_ref_chr: "data/reference/LDscores/"
  w_ld_chr: "data/reference/LDscores/"
  merge_alleles: "data/reference/w_hm3.snplist"
  chunksize: 500000
  n_override:
    SUD2023: 1025550
  n_col_override: {}

# SNP Heritability (target `h2`): ldsc.py --h2 with the LD scores above (ldsc.ld_ref_chr / w_ld_chr)
# Output: results/ldsc_h2/{trait}.log + results/ldsc_h2/h2_summary.tsv
h2:
  # Traits to estimate (the app sets these per run; CLI: --config 'h2={"traits": [...]}')
  traits: []
  # Intercept: empty = free (LDSC default, two-step estimator at chi^2 30);
  # a positive value is passed as --intercept-h2 (1 = classic constrained LD Score regression)
  intercept_h2: ""
  # Liability scale for case-control traits: both prevalences or neither, each strictly in (0, 1).
  #   pop_prev  (--pop-prev):  population prevalence K of the disorder
  #   samp_prev (--samp-prev): 0.5 if the trait was munged with an effective N (sum of effective
  #                            sample sizes); otherwise the GWAS case fraction cases / (cases + controls)
  # Traits not listed are estimated on the observed scale. Example:
  #   BipolarDisorder2024: {pop_prev: 0.01, samp_prev: 0.5}
  prevalence: {}

# Multiple-Testing Correction
# Benjamini-Hochberg FDR level, applied per trait: DNA across tag SNPs (one test per tag),
# RNA across the reference SNPs found in its GWAS
fdr_alpha: 0.05

# Track A: DNA Methylation (DNA ASM Tag SNPs & LD Proxies with CpG Annotations)
dna:
  mapping_table: "data/methylation/DNA_ASM_mapping_table.tsv"
  cpg_coordinates: "data/annotations/cpg_coordinates_hg19.tsv"
  gene_tss: "data/annotations/gencode_v19_gene_tss.tsv"
  tss_distance_cutoff: 5000
  # Tags absent from a GWAS: "best_ld_proxy" tests them via their highest-LD_R2 proxy, "none" skips them
  tag_fallback: "best_ld_proxy"

# Track B: RNA Methylation (RNA m6A SNP List)
rna:
  snp_list: "data/methylation/RNA_m6A_SNPlist.txt"
  # Step B2: genes each BH-significant SNP falls inside (Ensembl VEP REST; GRCh37 matches the
  # hg19 coordinates of Track A). Use "https://rest.ensembl.org" (and a new cache file) for GRCh38.
  ensembl_server: "https://grch37.rest.ensembl.org"
  ensembl_cache_file: "results/.cache/ensembl_grch37_genes_cache.json"

# GTEx v10 Brain eQTL Lookup Parameters (13 Brain Regions, Track A only)
gtex:
  brain_tissues:
    - "Brain_Amygdala"
    - "Brain_Anterior_cingulate_cortex_BA24"
    - "Brain_Caudate_basal_ganglia"
    - "Brain_Cerebellar_Hemisphere"
    - "Brain_Cerebellum"
    - "Brain_Cortex"
    - "Brain_Frontal_Cortex_BA9"
    - "Brain_Hippocampus"
    - "Brain_Hypothalamus"
    - "Brain_Nucleus_accumbens_basal_ganglia"
    - "Brain_Putamen_basal_ganglia"
    - "Brain_Spinal_cord_cervical_c-1"
    - "Brain_Substantia_nigra"
  p_threshold: 0.05
  cache_file: "results/.cache/gtex_eqtl_cache.json"
