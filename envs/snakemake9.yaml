# ==============================================================================
# Snakemake 9 HPC Environment Specification
# Create environment with:
#   conda env create -f envs/snakemake9.yaml
#   conda activate snakemake9_env
# ==============================================================================
name: snakemake9_env
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python >=3.10,<3.13
  - snakemake >=9.0
  - snakemake-executor-plugin-slurm
  - pandas >=2.0
  - numpy >=1.24
  - scipy >=1.10
  - statsmodels >=0.14
  - networkx >=3.0
  - matplotlib >=3.7
  - seaborn >=0.12
  - requests >=2.30
  - pyyaml >=6.0
  - plotly >=5.18
  - streamlit >=1.38
  - bitarray >=2.0
