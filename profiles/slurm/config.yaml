# ==============================================================================
# Snakemake 9 Slurm Profile for VIBRA HPC
#
# Usage (from the repository root, with snakemake9_env activated):
#   snakemake --profile profiles/slurm all
#   snakemake --profile profiles/slurm dna
#   snakemake --profile profiles/slurm rna
#
# Jobs are submitted with --export=ALL, so they inherit the activated conda env.
# Per-job Slurm logs are written to logs/slurm/{rule}/{wildcards}/{jobid}.log
# (the executor plugin manages --output/--error itself; do not set them in slurm_extra).
# ==============================================================================

executor: slurm
jobs: 10
latency-wait: 60
printshellcmds: true
slurm-logdir: "logs/slurm"
slurm-keep-successful-logs: true

default-resources:
  slurm_partition: "irbio01"
  runtime: 30
  mem_mb: 4000

set-resources:
  munge_sumstats:
    runtime: 360
    mem_mb: 16000
  overlap_dna_asm:
    runtime: 60
    mem_mb: 8000
  overlap_rna_m6a:
    runtime: 60
    mem_mb: 8000
  lookup_gtex_brain_eqtls:
    runtime: 120
    mem_mb: 4000
  annotate_rna_genes:
    runtime: 120
    mem_mb: 4000
  ldsc_rg:
    runtime: 60
    mem_mb: 8000
  # Single-trait LD Score regression: same LD-score loading as rg, one regression (~15 s locally)
  ldsc_h2:
    runtime: 30
    mem_mb: 8000
